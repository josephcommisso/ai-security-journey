name: Security pipeline
on: push
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Grab the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Say hello
        run: echo "pipeline works"
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan Dockerfiles for risky settings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0
        with:
          scan-type: config
          scan-ref: lesson-3-docker
          exit-code: '1'
          severity: HIGH,CRITICAL
          # Dockerfile.bad is intentionally insecure (Leaky Box "before" example) - accepted risk
          skip-files: lesson-3-docker/leaky-box/Dockerfile.bad
